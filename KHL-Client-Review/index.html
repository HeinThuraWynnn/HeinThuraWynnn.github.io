<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>KHL | Private Client Review</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f4f6f7;color:#122b40;font-family:Arial,sans-serif;line-height:1.6}.card{width:100%;max-width:440px;background:white;border:1px solid #dce4e8;border-radius:16px;padding:36px;box-shadow:0 16px 60px #122b400d}.brand{font-weight:bold;font-size:14px}.label{color:#17638b;font-size:11px;letter-spacing:1.5px;margin-top:32px;font-weight:bold}h1{font-size:29px;line-height:1.2;margin:10px 0 16px}p{color:#586875;font-size:14px}label{display:block;font-size:14px;font-weight:bold;margin:24px 0 8px}input,button{width:100%;font:inherit;padding:12px 14px;border-radius:6px}input{border:1px solid #bac9d2}input:focus{outline:2px solid #17638b;outline-offset:2px}button{margin-top:16px;background:#122b40;color:white;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#status{min-height:24px;margin:14px 0 0}#status.error{color:#ab2736}.foot{font-size:12px;margin:24px 0 0}@media(max-width:480px){.card{padding:26px}}
</style>
</head>
<body>
<main class="card"><div class="brand">Wynn Solutions Myanmar</div><div class="label">PRIVATE CLIENT REVIEW</div><h1>KHL website proposal</h1><p>Enter your review password to view the proposal, design concepts and service agreement.</p><form id="unlock"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required autofocus aria-describedby="status"><button id="submit" type="submit">Open review</button><p id="status" role="status" aria-live="polite"></p></form><noscript><p>Please enable JavaScript to open this encrypted review.</p></noscript><p class="foot">Prepared for KAUNG HAN LINN COMPANY LIMITED</p></main>
<script>
const decode = value => Uint8Array.from(atob(value), character => character.charCodeAt(0));
document.getElementById('unlock').addEventListener('submit', async event => {
  event.preventDefault();
  const button = document.getElementById('submit'), status = document.getElementById('status');
  button.disabled = true; status.className = ''; status.textContent = 'Opening your review…';
  let payload;
  try {
    if (!crypto.subtle) throw new Error('Please use HTTPS and an up-to-date browser.');
    const response = await fetch('./review.enc.json', {cache:'no-store'});
    if (!response.ok) throw new Error('The review could not be loaded. Please try again.');
    payload = await response.json();
  } catch (error) {
    status.className = 'error'; status.textContent = error.message; button.disabled = false; return;
  }
  try {
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('password').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:decode(payload.salt), iterations:payload.iterations, hash:'SHA-256'}, material, {name:'AES-GCM',length:256}, false, ['decrypt']);
    const plaintext = await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv)}, key, decode(payload.data));
    const review = JSON.parse(new TextDecoder().decode(plaintext));
    let html = review.html;
    for (const [name, file] of Object.entries(review.files)) {
      const url = URL.createObjectURL(new Blob([decode(file.data)], {type:file.type}));
      html = html.split('"' + name + '"').join('"' + url + '"');
    }
    html = html.replace('<head>', '<head><meta name="robots" content="noindex,nofollow,noarchive">');
    html = html.replace('<div class="brand">', '<div class="brand"><button type="button" onclick="location.reload()" style="float:right;margin-left:20px;cursor:pointer">Lock review</button>');
    document.getElementById('password').value = '';
    document.open(); document.write(html); document.close();
  } catch {
    status.className = 'error'; status.textContent = 'Incorrect password. Please try again.';
    button.disabled = false; document.getElementById('password').focus();
  }
});
</script>
</body></html>
